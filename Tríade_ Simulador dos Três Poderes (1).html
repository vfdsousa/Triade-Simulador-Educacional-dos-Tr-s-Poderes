function hexRgb(h){const n=parseInt(h.slice(1),16);return [n>>16&255,n>>8&255,n&255];}
function rgbHex(a){return '#'+a.map(v=>Math.round(clamp(v,0,255)).toString(16).padStart(2,'0')).join('');}
function mix(a,b,t){const x=hexRgb(a),y=hexRgb(b);return rgbHex(x.map((v,i)=>v+(y[i]-v)*t));}

function lookCard(){

      <div><div class="${lab}">Cabelo</div><div class="grid grid-cols-3 gap-2">${HAIRS[draft.gender].map(h=>seg('hair',h[0],draft.hair===h[0],h[1])).join('')}</div></div>

    </div>

}

/* ===================== MECÂNICA ===================== */
function addYears(y){
  const c=cargo(),last=st.path[st.path.length-1];
  if(last&&last.cargo===c)last.years+=y;else st.path.push({cargo:c,power:st.power,years:y});
  st.yearsBy[st.power]+=y;st.yearsPower+=y;st.sinceOffer+=y;st.sinceElection+=y;st.age+=y;st.year+=y;
}
function drift(y){
  for(let i=0;i<y;i++){
    st.ap+=(45-st.ap)*0.04;
    st.es+=(50-st.es)*0.04;
    st.sj+=(45-st.sj)*0.03;
    st.pr-=0.35;
    st.idh+=0.0004+(st.sj-50)*0.00002+(st.pr-50)*0.00001;
  }
  st.ap=clamp(st.ap);st.es=clamp(st.es);st.sj=clamp(st.sj);st.pr=clamp(st.pr);st.idh=clamp(st.idh,0.4,0.97);st.risk=clamp(st.risk-y*1.5);
}
function applyEffects(e,m){
  const d=scaleFx(e,m);
  st.pr=clamp(st.pr+d[0]);st.ap=clamp(st.ap+d[1]);st.es=clamp(st.es+d[2]);
  st.idh=clamp(st.idh+d[3],0.4,0.97);st.sj=clamp(st.sj+d[4]);st.risk=clamp(st.risk+d[5]);
  return d;
}
function checkOver(){
  if(st.pr<=0)return 'pr';
  if(st.es<=0)return 'es';
  if(st.ap<=0&&st.power!=='jud')return 'ap';
  return null;
}
function pickEvent(){
  const pool=EVENTS[st.power],used=st.used[st.power];
  let av=pool.map((_,i)=>i).filter(i=>!used.includes(i));
  if(!av.length){used.length=0;av=pool.map((_,i)=>i);}
  const i=rnd(av);used.push(i);return pool[i];
}

let qiv=null;
function stopQ(){if(qiv){clearInterval(qiv);qiv=null;}}
function runSteps(steps){
  const run=()=>{
    if(st.over)return;
    const r=checkOver();if(r)return endGame(r);
    const f=steps.shift();
    if(!f){busy=false;refreshDash();return;}
    f(run);
  };
  run();
}
const optBtn=(attr,i,l,top,chipHtml)=>`<button ${attr}="${i}" class="w-full rounded-2xl border border-white/10 bg-[#3a3a41] p-3 text-left transition hover:bg-[#44444c] active:scale-[.98]"><div class="flex gap-3"><div class="grid h-7 w-7 shrink-0 place-items-center rounded-full bg-white/10 text-sm font-extrabold">${top}</div><div class="text-sm font-semibold leading-snug">${l}</div></div>${chipHtml?`<div class="mt-2 flex flex-wrap gap-1.5">${chipHtml}</div>`:''}</button>`;

const banner=k=>`<div class="-mx-5 -mt-5 mb-3 rounded-t-3xl border-b px-5 py-2 text-xs font-extrabold tracking-wider ${KIND[k].cls}"><span class="animate-pulse">${KIND[k].lab}</span></div>`;
function resultHtml(head,text,d,note,extra){
  return `<div class="text-xs font-bold uppercase tracking-wider text-neutral-400">${head}</div>

}

/* ---------- Quick events ---------- */
function stepQuick(done){
  if(Math.random()>Math.min(0.85,0.25+0.075*(st.lastYears||4)))return done();
  const pool=QUICK.filter(q=>q.p.includes(st.power)&&q.id!==st.lastQuick);
  if(!pool.length)return done();
  const q=rnd(pool);st.lastQuick=q.id;showQuick(q,done);
}
function showQuick(q,done){
  const SECS=15;
  openModal(`${banner(q.k)}
    <div class="flex items-center gap-2"><div class="h-1.5 flex-1 overflow-hidden rounded-full bg-black/40"><div id="qbar" class="h-full rounded-full bg-rose-400" style="width:100%"></div></div><span id="qsec" class="w-8 text-right text-xs font-bold tabular-nums text-rose-300">${SECS}s</span></div>
    <h2 class="mt-3 text-xl font-extrabold leading-tight">${q.t}</h2>
    <p class="mt-2 text-sm leading-relaxed text-neutral-300">${fillAto(q.d)}</p>
    ${q.id==='media'&&st.risk>=50?`<p class="mt-2 rounded-xl bg-rose-500/15 p-2 text-xs font-semibold text-rose-200">⚠️ Seu Risco de Escândalo está em ${Math.round(st.risk)}%. A redação pode ter documentos.</p>`:''}
    <p class="mt-2 text-[11px] font-semibold text-neutral-400">Decida rápido: se o tempo acabar, você perde a iniciativa.</p>
    <div class="mt-3 space-y-3">${q.o.map((o,i)=>optBtn('data-q',i,fillAto(o.l),'ABC'[i],'')).join('')}</div>`);
  const t0=Date.now(),bar=$('#qbar'),sec=$('#qsec');
  stopQ();
  qiv=setInterval(()=>{
    if(!bar||!bar.isConnected){stopQ();return;}
    const rem=Math.max(0,SECS-(Date.now()-t0)/1000);
    bar.style.width=(rem/SECS*100)+'%';sec.textContent=Math.ceil(rem)+'s';
    if(rem<=0){stopQ();resolveQuick(q,-1,done);}
  },100);
  modalEl.querySelectorAll('[data-q]').forEach(b=>b.addEventListener('click',()=>{stopQ();resolveQuick(q,+b.dataset.q,done);}));
}
function resolveQuick(q,i,done){
  const o=i>=0?q.o[i]:{l:'Você hesitou',r:'O tempo acabou e outros decidiram por você. A iniciativa ficou com os seus adversários.',e:[-6,-4,-4,0,0,8]};
  const d=applyEffects(o.e,1);
  if(i>=0){st.lean=clamp(st.lean+leanOf(o.e),-60,60);updateAlign(o.e);}
  if(i>=0){const tg=o.tag||(QTAG[q.id]||[])[i];if(tg)bump(tg);}
  logAdd(`${q.t}: ${fillAto(o.l)}`);refreshDash();
  if(i>=0&&o.s)showRally(o,q);
  headlineIf({title:q.t,opt:fillAto(o.l),d});
  const leak=!!o.deny&&st.risk>=50;
  openModal(banner(q.k)+resultHtml('Resultado: '+fillAto(o.l),fillAto(o.r),d,q.n,leak?'<p class="mt-2 rounded-xl bg-rose-500/15 p-2 text-xs font-semibold text-rose-200">⚠️ Com o risco alto, a negativa não colou: documentos vão vazar.</p>':''));
  $('#go').addEventListener('click',()=>{closeModal();leak?showLeak(done,true):done();});
}

/* ---------- Vazamento / escândalo ---------- */
function stepLeak(done){
  if(st.risk>=25&&Math.random()<(st.risk-15)/100*0.3)showLeak(done,false);else done();
}
function showLeak(done,forced){
  const sv=st.risk/100;
  const e=[-(8+Math.round(sv*14)),-(6+Math.round(sv*12)),-(4+Math.round(sv*10)),0,-3,20-st.risk];
  const d=applyEffects(e,1);st.scandals++;
  logAdd('Escândalo público: investigação aberta.');refreshDash();showHeadline(headlineFor({kind:'scandal',d}));
  const txt={exe:'A Polícia Federal faz buscas em endereços ligados ao seu governo. O caso domina os telejornais.',leg:'O seu gabinete é alvo de uma operação. A imprensa publica trechos de mensagens e extratos.',jud:'A Corregedoria abre uma sindicância depois que mensagens suas vazam. O caso vira manchete nacional.'}[st.power];
  openModal(banner('media').replace('REPORTAGEM BOMBÁSTICA','ESCÂNDALO VEM À TONA')+
    `<h2 class="text-xl font-extrabold leading-tight">O passado bateu à porta</h2>`+
    resultHtml('Consequência de ações anteriores',(forced?'Os documentos que você tentou negar vieram à tona. ':'Seus rastros foram descobertos. ')+txt,d,'Investigações são conduzidas pela Polícia Federal e pelo Ministério Público, mas só a Justiça pode condenar.'));
  $('#go').addEventListener('click',()=>{closeModal();done();});
}

/* ---------- Eleição / reeleição ---------- */
const electedOffice=()=>st.power==='leg'||(st.power==='exe'&&st.rank>=1);
function electionChance(b){
  let sc=0.45*st.ap+0.2*st.pr+0.15*st.es+0.2*clamp((st.idh-0.6)/0.3*100);
  sc-=['ap','pr','es'].filter(k=>st[k]<25).length*18;
  sc-=Math.max(0,st.risk-40)*0.4;
  return clamp(sc+b,2,95);
}
function stepElection(done){
  if(electedOffice()&&st.sinceElection>=8)showElection(done);else done();
}
function showElection(done){
  const nm={ap:'Apoio Popular',pr:'Prestígio',es:'Estabilidade'},warns=[];

  const base=Math.round(electionChance(0));
  const opts=[
   {l:'Campanha propositiva e transparente',b:0,e:[4,2,0,0,0,-6],r:'Sua campanha apostou em propostas e transparência.'},

  openModal(`
    <div class="text-xs font-bold uppercase tracking-wider text-sky-300">🗳️ Hora de ir às urnas · ${st.year} · ${st.age} anos</div>
    <h2 class="mt-1 text-xl font-extrabold leading-tight">Eleição: continuar como ${cargo()}?</h2>
    <p class="mt-2 text-sm text-neutral-300">Os eleitores vão decidir se você segue no cargo. Sua chance depende dos seus atributos.</p>
    <div class="mt-3 rounded-2xl bg-black/25 p-3">
      <div class="flex items-end justify-between"><span class="text-sm font-semibold">Chance de vitória hoje</span><span class="text-3xl font-extrabold tabular-nums" style="color:${colorOf(base)}">${base}%</span></div>
      <div class="mt-2 h-2.5 overflow-hidden rounded-full bg-black/40"><div class="h-full rounded-full" style="width:${base}%;background:${colorOf(base)}"></div></div>
      ${warns.length?`<ul class="mt-2 space-y-1 text-xs font-semibold text-rose-300">${warns.map(w=>`<li>⚠️ ${w}</li>`).join('')}</ul>`:'<p class="mt-2 text-xs text-neutral-400">Nenhum atributo em nível crítico.</p>'}
    </div>
    <div class="mt-3 space-y-3">${opts.map((o,i)=>optBtn('data-el',i,o.l,'ABC'[i],chanceChip(electionChance(o.b))+chips(preview(o.e,1)))).join('')}</div>`);
  modalEl.querySelectorAll('[data-el]').forEach(b=>b.addEventListener('click',()=>{
    const o=opts[+b.dataset.el],pc=electionChance(o.b),win=Math.random()*100<pc;
    const d=applyEffects(o.e,1);
    if(!win){logAdd('Derrota nas urnas.');return endGame('elec');}

    showHeadline(headlineFor({kind:'elecWin',d}));openModal(resultHtml('Resultado da eleição',`Você venceu! A chance era de ${Math.round(pc)}%. ${o.r}`,d,'O voto é obrigatório de 18 a 70 anos e facultativo para jovens de 16 e 17, maiores de 70 e analfabetos.'));
    $('#go').addEventListener('click',()=>{closeModal();done();});
  }));
}

/* ---------- Processo de cassação / impeachment ---------- */
function procTrigger(){
  if(st.power==='jud')return st.pr<=20||st.es<=15||st.risk>=90;
  return st.es<=20||st.pr<=15||st.risk>=90;
}
function procChance(b){return clamp(22+0.55*st.es+0.25*st.ap+0.2*st.pr-0.3*st.risk-10*st.procs+b,3,90);}
function stepProcess(done){if(procTrigger())showProcess(done);else done();}
function showProcess(done){
  const T={
   exe:{t:'Pedido de impeachment aceito',d:'A Câmara autorizou a abertura do processo e o Senado vai julgá-lo. Para condenar, são necessários 2/3 dos votos.',n:'O impeachment exige autorização de 2/3 da Câmara (342 dos 513 deputados) e condenação por 2/3 do Senado (54 dos 81 senadores).'},
   leg:{t:'Processo de cassação aberto',d:'O Conselho de Ética recomendou a perda do seu mandato. O plenário decide em votação.',n:'A cassação de deputados e senadores exige voto da maioria absoluta da respectiva Casa (art. 55 da Constituição).'},

  const why=[];
  if(st.es<=20)why.push('Estabilidade/Apoio político em nível crítico');
  if(st.pr<=(st.power==='jud'?20:15))why.push('Prestígio em nível crítico');
  if(st.risk>=90)why.push('Risco de Escândalo no limite');
  const opts=[
   {l:'Contratar defesa técnica e provar sua versão',b:4,e:[6,0,0,0,0,-10]},
   {l:'Articular nos bastidores com os parlamentares',b:14,e:[-6,0,4,0,-3,10]},
   {l:'Apelar à opinião pública com discurso e mobilização',b:Math.round(st.ap*0.18),e:[0,6,-4,0,0,0]}];
  const base=Math.round(procChance(0));
  openModal(`
    <div class="text-xs font-bold uppercase tracking-wider text-rose-300">⚖️ Zona de perigo · ${st.year} · ${st.age} anos</div>
    <h2 class="mt-1 text-xl font-extrabold leading-tight">${T.t}</h2>
    <p class="mt-2 text-sm text-neutral-300">${T.d}</p>
    <ul class="mt-2 space-y-1 text-xs font-semibold text-rose-300">${why.map(w=>`<li>⚠️ ${w}</li>`).join('')}</ul>
    <div class="mt-3 rounded-2xl bg-black/25 p-3"><div class="flex items-end justify-between"><span class="text-sm font-semibold">Chance de sobreviver</span><span class="text-3xl font-extrabold tabular-nums" style="color:${colorOf(base)}">${base}%</span></div>
    ${st.procs?`<p class="mt-1 text-xs text-neutral-400">Reincidência: −${10*st.procs} pontos pelos processos anteriores.</p>`:''}</div>
    <div class="mt-3 space-y-3">${opts.map((o,i)=>optBtn('data-pr',i,o.l,'ABC'[i],'')).join('')}</div>`);
  modalEl.querySelectorAll('[data-pr]').forEach(b=>b.addEventListener('click',()=>{
    const o=opts[+b.dataset.pr],pc=procChance(o.b),ok=Math.random()*100<pc;
    if(!ok){logAdd('Processo de cassação/impeachment: você foi condenado.');return endGame('proc');}
    const d=applyEffects(o.e.map((v,k)=>v+[0,0,10,0,0,-15][k]),1);

  }));
}

/* ---------- Troca de partido ---------- */
function stepParty(done){
  if(st.power==='jud'||!isGeneral(st.year))return done();
  if(!st.filiado)return partyWindow(done,true,'free');
  if(st.year-st.fbYear>=8)return partyFeedback(done);
  return maybeWindow(done);
}
function alignTone(a){return a>=60?'good':a>=45?'ok':a>=30?'warn':'expel';}
function partyFeedback(done){
  const k=st.party,x=PARTIES[k],al=Math.round(alignOf(k)),kind=alignTone(al);
  st.fbYear=st.year;
  const eff={good:[2,0,4,0,0,0],ok:[0,0,1,0,0,0],warn:[0,0,-3,0,0,0],expel:[-3,-3,-8,0,0,0]}[kind];
  const d=applyEffects(eff,1);
  logAdd(`Reunião de alinhamento com o ${x.sig}: alinhamento de ${al}%.`);
  if(kind==='expel'){st.filiado=false;logAdd(`${x.sig} expulsou você por descumprir as diretrizes do partido.`);}
  refreshDash();
  showPartyMeeting(kind,al,d,()=>{
    if(kind==='expel')return partyWindow(done,true,'expelled');
    if(kind==='warn'){
      return choice(`🔄 Depois da reunião · ${st.year}`,'O que você vai fazer?',`O ${x.sig} cobrou mais alinhamento. Você pode prometer fidelidade ou procurar outro partido agora, durante a janela partidária.`,
        [{top:'🤝',l:`Prometer mais alinhamento ao ${x.sig}`},{top:'🔄',l:'Buscar outro partido na janela partidária'}],
        i=>i===0?done():partyWindow(done,false,'voluntary'));
    }
    maybeWindow(done);
  });
}
function maybeWindow(done){
  const cur=st.party,ca=alignOf(cur),attract=(st.ap+st.pr)/2-st.risk*0.3;
  const better=Object.keys(PARTIES).filter(k=>k!==cur&&alignOf(k)>=Math.max(55,ca+10));
  if(attract>=45&&better.length&&Math.random()<0.7)return partyWindow(done,false,'invite');
  done();
}
function partyWindow(done,forced,why){
  const cur=st.filiado?st.party:null,attract=(st.ap+st.pr)/2-st.risk*0.3;
  const items=Object.keys(PARTIES).map(k=>{
    const x=PARTIES[k],a=Math.round(alignOf(k)),isCur=k===cur;
    const ok=a>=50&&!isCur&&attract>=40;
    const status=isCur?'Seu partido atual':a<50?'Bloqueado: alinhamento baixo':attract<40?'Sem convite: baixa projeção':a>=60?'Convite recebido':'Disponível';
    const bar=`<div class="mt-1 h-1.5 w-full overflow-hidden rounded-full bg-white/10"><div class="h-full rounded-full" style="width:${a}%;background:${a>=60?'#34d399':a>=50?'#fbbf24':'#f87171'}"></div></div>`;
    return {key:k,top:x.em,l:x.n,note:`Alinhamento ${a}% · ${status}`,html:bar,dis:!ok};
  });
  if(forced)items.push({none:true,top:'🚪',l:'Seguir sem partido',note:'Sem filiação você não pode disputar eleições.'});
  else items.push({stay:true,top:'↩️',l:`Permanecer no ${PARTIES[cur].sig}`});
  const T={
    expelled:[G('Você foi expulso do partido','Você foi expulsa do partido'),'Para disputar eleições, você precisa de uma nova filiação. Cada partido só aceita quem tem pelo menos 50% de alinhamento com as suas diretrizes.'],
    free:['Janela partidária: você está sem partido','Para disputar eleições, você precisa de uma filiação. Cada partido só aceita quem tem pelo menos 50% de alinhamento com as suas diretrizes.'],
    voluntary:['Troca voluntária de partido','Veja o seu alinhamento com cada partido, calculado a partir das suas decisões ao longo da carreira. Só é possível entrar onde o alinhamento é de pelo menos 50%.'],
    invite:['Convites na janela partidária','Outros partidos notaram o seu perfil. O alinhamento de cada um é calculado a partir das suas decisões ao longo da carreira.']}[why];
  choice(`🔄 Janela partidária · ${st.year}`,T[0],T[1],items,i=>{
    const it=items[i];
    if(it.stay){logAdd(`Você permaneceu no ${PARTIES[cur].sig}.`);return done();}

let AC=null,soundOn=true;
function actx(){
  try{
    if(!AC){const C=window.AudioContext||window.webkitAudioContext;if(!C)return null;AC=new C();}
    if(AC.state==='suspended')AC.resume();
    return AC;
  }catch(e){return null;}
}
function tone(f,t0,dur,type,vol,f2){
  const a=actx();if(!a)return;
  const o=a.createOscillator(),g=a.createGain(),t=a.currentTime+t0;
  o.type=type||'sine';o.frequency.setValueAtTime(f,t);
  if(f2)o.frequency.exponentialRampToValueAtTime(f2,t+dur);
  g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(vol||.15,t+.02);g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
  o.connect(g);g.connect(a.destination);o.start(t);o.stop(t+dur+.05);
}
function noise(t0,dur,vol,freq,q,swell){
  const a=actx();if(!a)return;
  const n=Math.floor(a.sampleRate*dur),buf=a.createBuffer(1,n,a.sampleRate),d=buf.getChannelData(0);
  for(let i=0;i<n;i++)d[i]=Math.random()*2-1;
  const src=a.createBufferSource();src.buffer=buf;
  const fl=a.createBiquadFilter();fl.type='bandpass';fl.frequency.value=freq||1000;fl.Q.value=q||.7;
  const g=a.createGain(),t=a.currentTime+t0;
  g.gain.setValueAtTime(0.0001,t);
  g.gain.exponentialRampToValueAtTime(vol||.2,t+(swell?dur*.5:.02));
  g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
  src.connect(fl);fl.connect(g);g.connect(a.destination);src.start(t);
}
function sfx(n){
  if(!soundOn)return;
  try{
    if(n==='pow'){noise(0,.28,.4,900,.8);tone(170,0,.28,'square',.18,55);}
    else if(n==='fanfare'){[523,659,784,1047].forEach((f,i)=>tone(f,i*.14,.38,'triangle',.18));tone(1047,.6,.6,'triangle',.14);}
    else if(n==='sunset'){[392,494,587,784].forEach((f,i)=>tone(f,i*.35,1.1,'sine',.12));}
    else if(n==='paper'){noise(0,.2,.25,3200,.6);noise(.14,.14,.18,2400,.6);tone(880,.1,.15,'sine',.06);}
    else if(n==='jingle'){[659,784,988,784,1047].forEach((f,i)=>tone(f,i*.12,.2,'square',.07));}
    else if(n==='ding'){tone(1320,0,.25,'sine',.1);tone(1760,.12,.3,'sine',.08);}
    else if(n==='drum'){for(let i=0;i<5;i++)tone(120,i*.18,.15,'sine',.2,60);}
    else if(n==='crowd'){noise(0,1.6,.22,700,.35,true);noise(.2,1.4,.15,1800,.5,true);[0,.3,.55].forEach(x=>tone(900+x*400,x+.2,.12,'triangle',.05));}
  }catch(e){}
}

/* ---------- ciclo: fatias de 2 anos com 3 eventos cada ---------- */
function advance(){
  if(busy||st.over)return;
  busy=true;
  startSlice(st.cycleLen/2);
}
function startSlice(left){
  const years=Math.min(2,RETIRE-st.age);
  if(years<=0)return endGame('ret');
  const y0=st.year;st.lastYears=years;addYears(years);drift(years);
  logAdd(`${years} anos se passaram (${y0} → ${st.year}).`);refreshDash();
  timeSplash(y0,st.year,years,()=>{
    const r=checkOver();if(r)return endGame(r);
    if(st.age>=RETIRE)return endGame('ret');
    st.sliceLeft=left-1;st.queue=buildQueue();slotStep();
  });
}
function buildQueue(){
  const q=['main','quick','quick'];
  if(Math.random()<.3)q[1+Math.floor(Math.random()*2)]='main';
  q.sort(()=>Math.random()-.5);
  st.evTotal=q.length;st.evN=0;
  return q;
}
function pickQuick(){
  const pool=QUICK.filter(q=>q.p.includes(st.power)&&q.id!==st.lastQuick);
  let av=pool.filter(q=>!st.usedQ.includes(q.id));
  if(!av.length){st.usedQ=[];av=pool;}
  if(!av.length)return null;
  const q=rnd(av);st.usedQ.push(q.id);st.lastQuick=q.id;return q;
}
function slotStep(){
  const r=checkOver();if(r)return endGame(r);
  const slot=st.queue.shift();
  if(!slot)return endSlice();
  st.evN++;
  if(slot==='quick'){const q=pickQuick();if(q)return showQuick(q,afterEvent);}
  showEvent(pickEvent(),st.lastYears);
}
function afterEvent(){
  const r=checkOver();if(r)return endGame(r);
  snap();
  runSteps([stepLeak,stepProcess,()=>slotStep()]);
}
function endSlice(){
  runSteps([stepParty,stepCalendar,stepTransition,done=>{if(st.sliceLeft>0&&!st.over)startSlice(st.sliceLeft);else done();}]);
}

/* ---------- candidatura ---------- */
function candidacy(done){
  if(!st.filiado)return noParty(done);
  const cur=curOff();
  const mk=(key,reel)=>{
    const o=OFF[key];let dis=false,note='';
    if(st.age<o.age){dis=true;note=`Idade mínima: ${o.age} anos`;}
    if(reel&&(key==='gov'||key==='pres')&&st.terms>=2){dis=true;note='Já cumpriu 2 mandatos seguidos';}
    return {key,reel,dis,note,top:reel?'🔁':'🆕',l:reel?`Disputar a reeleição: ${gn(o.n)}`:`Disputar o cargo de ${gn(o.n)}`};
  };
  const items=[];
  if(cur)items.push(mk(cur,true));
  ({dep:['sen','gov'],sen:['gov','pres'],gov:['pres','sen'],pres:['sen']}[cur]||['gov','sen','dep']).forEach(k=>items.push(mk(k,false)));
  items.push({stay:true,top:'🚪',l:cur?'Não disputar e deixar o cargo':'Seguir no ministério',note:cur?'Seu mandato termina e você terá que escolher outro rumo.':''});
  choice(`🗳️ Eleições gerais · ${st.year}`,cur?'Fim de mandato: o que fazer?':'Convenção partidária',
    cur?`Seu mandato de ${cargo()} chega ao fim. Perder a eleição encerra a sua carreira.`:'É ano de eleições. Você pode deixar o ministério para disputar um cargo, mas perder encerra a sua carreira.',
    items,i=>{
      const it=items[i];
      if(it.stay){if(cur)return showTransition(done,true);logAdd('Você preferiu seguir no ministério.');return done();}
      runCampaign(it.key,it.reel,done);
    });
}

const NAMES_F=['Marina Cavalcante','Helena Bastos','Beatriz Salgado','Lúcia Fontana','Clarice Monteiro','Isadora Vilela','Tereza Quintela','Aline Castelar','Rosana Pimentel','Paula Aragão','Débora Siqueira','Lívia Campelo'];
const NAMES_M=['Augusto Pelegrino','Otávio Brandão','Teodoro Lins','Hélio Cardim','Fabrício Mendonça','Reginaldo Teixeira','Caetano Frota','Lauro Menezes','Ícaro Valadares','Murilo Sampaio','Edgar Linhares','Nelson Bittencourt'];
function rndLook(g){
  const hs=HAIRS[g];
  return {gender:g,beard:g==='m'&&Math.random()<.35?rnd(['barba','bigode']):'none',skin:Math.floor(Math.random()*6),hair:rnd(hs)[0],hcol:Math.floor(Math.random()*4),glasses:Math.random()<.3};
}
let E=null;
function makeRivals(n){
  const f=NAMES_F.slice().sort(()=>Math.random()-.5),m=NAMES_M.slice().sort(()=>Math.random()-.5);
  const others=Object.keys(PARTIES).filter(k=>k!==st.party).sort(()=>Math.random()-.5);
  const fi=Math.floor(Math.random()*n),out=[];
  for(let i=0;i<n;i++){
    const g=i===fi?'f':(Math.random()<.45?'f':'m'),name=(g==='f'?f:m).pop();
    out.push({name,first:name.split(' ')[0],look:rndLook(g),age:42+Math.floor(Math.random()*24),party:others[i%others.length],s:38+Math.random()*20+(E.key==='pres'?4:E.key==='gov'?2:0),sk:(()=>{const o={};TOP.forEach(t=>{o[t.k]=Math.random()*8-3;});return o;})()});
  }
  return out;
}
function myStrength(){
  let sc=0.45*st.ap+0.2*st.pr+0.15*st.es+0.2*clamp((st.idh-0.6)/0.3*100);
  sc-=['ap','pr','es'].filter(k=>st[k]<25).length*18;
  sc-=Math.max(0,st.risk-40)*0.4;
  sc+=E.reel?6:0;
  return clamp(sc,5,95);
}
function shares(strs,noise){
  const w=strs.map(x=>Math.pow(Math.max(5,x+(noise?(Math.random()-.5)*noise:0)),2)),t=w.reduce((a,b)=>a+b,0);
  return w.map(x=>x/t*100);
}
function runCampaign(key,reel,done){
  const y=st.year,off=OFF[key];
  E={key,off,reel,done,y,bonus:0,seats:key==='dep'?5:key==='sen'?(((y-2026)%8===0)?2:1):1};
  E.rivals=makeRivals(key==='dep'?11:key==='pres'?5:4);

function pollRows(sh,und,base){

/* ---------- debate ---------- */
const TOP=[
  {k:'eco',t:'a economia e o emprego',data:true},
  {k:'sau',t:'a saúde pública'},
  {k:'edu',t:'a educação'},
  {k:'seg',t:'a segurança pública'},

function topicBase(k){
  switch(k){

    case 'edu':return (st.idh-0.76)*90+(st.pr-50)/20;

}
const WEAK_REPLY=['Bem... é um tema complexo, e estamos estudando o assunto.','Isso será detalhado no plano de governo, no momento certo.','Eu prefiro falar de outro assunto, se me permite.'];
const STRONG_REPLY=['Minha equipe tem um plano completo, e você nunca apresentou nada!','Pergunta fraca. Aliás, vamos falar do seu histórico nesse tema.','Os números estão aí, e eles me dão razão.'];
const moodOf=g=>g>=3?'good':g<=-1?'bad':'neutral';
function showDebate(first,line,reply,mood,cb,g){

function askDebate(){
  if(E.key==='dep')return finishCampaign();
  E.rival=E.rivals.slice().sort((a,b)=>b.s-a.s)[0];
  E.skill={};TOP.forEach(t=>{E.skill[t.k]=topicBase(t.k)+Math.random()*6-3;});
  debateAsk();
}
function debateAsk(){
  const rv=E.rival,pool=TOP.slice().sort(()=>Math.random()-.5).slice(0,4);
  choice('Etapa 3 de 4 · Debate',`Debate contra ${esc(rv.name)}`,'Primeira rodada: você faz uma pergunta ao adversário. Cuidado: perguntar sobre um tema em que você é vulnerável pode virar o jogo.',
    pool.map(t=>({top:'❓',l:`Perguntar sobre ${t.t}`})),
    i=>{
      const t=pool[i],sk=E.skill[t.k],rs=rv.sk[t.k];
      let g=(sk-rs)*0.7+Math.random()*5-2.5;
      if(t.k==='cor'&&st.risk>45)g-=4;
      if(sk<-2)g-=2;
      E.bonus+=g;if(g>0)rv.s-=g*.8;else rv.s+=-g*.5;
      showDebate('me',`Pergunto a ${rv.first}: qual é o seu plano para ${t.t}?`,g>=1?rnd(WEAK_REPLY):rnd(STRONG_REPLY),moodOf(g),()=>debateAnswer(),g);
    });
}
function debateAnswer(){
  const rv=E.rival;
  const t=TOP.slice().sort((a,b)=>(rv.sk[b.k]-E.skill[b.k])-(rv.sk[a.k]-E.skill[a.k]))[Math.floor(Math.random()*3)];
  const sk=E.skill[t.k];
  const opts=[
    {l:'Resposta técnica, com dados e metas',note:'Exige domínio do tema',b:sk*.6+(st.pr-50)/14+Math.random()*3-1.5,line:'Tenho metas, números e prazos para cada ponto do plano.'},
    {l:'Resposta emocional, falando com o povo',note:'Funciona melhor quando o apoio popular é alto',b:(st.ap-50)/12+(t.data?-1.5:.8)+Math.random()*4-2,line:'Eu conheço a dor do povo e vou resolver junto com vocês.'},
    {l:'Atacar o adversário',note:'Alto risco',b:Math.random()<.45?5.5:-5,line:`Quem está preso ao passado é você, ${rv.first}!`,risk:true},
    {l:'Desviar da pergunta e mudar de assunto',note:'Pode soar como fuga',b:Math.random()<.35?-4:-.5,line:'Antes de responder, preciso lembrar o que realmente importa para o país.'}];
  choice('Etapa 3 de 4 · Debate',`${esc(rv.first)} pergunta a você`,`Segunda rodada: o adversário quer saber o seu plano para ${t.t}.`,opts.map(o=>({top:'🗣️',l:o.l,note:o.note})),i=>{
    const o=opts[i];E.bonus+=o.b;
    if(o.risk&&o.b<0)applyEffects([-2,0,-3,0,0,6],1);
    refreshDash();
    showDebate('rv',`${st.name.split(' ')[0]}, qual é o seu plano para ${t.t}?`,o.line,moodOf(o.b),()=>debateClose(),o.b);
  });
}
function debateClose(){
  const mine=myStrength()+E.bonus;
  const rank=1+E.rivals.filter(r=>r.s>mine).length;
  const opts=[

    <button data-cutclose class="mt-3 w-full rounded-xl bg-emerald-500 py-3 font-extrabold text-black active:scale-95">Continuar ▶</button></div>`,
    ()=>{
      sfx('drum');

      setTimeout(()=>{rows.forEach((r,i)=>{const b=el.querySelector(`[data-pb="${i}"]`);if(b)b.style.width=(r.v/max*100)+'%';});},80);
      const t0=Date.now(),iv=setInterval(()=>{
        if(curCut!==mine){clearInterval(iv);return;}
        const k=Math.min(1,(Date.now()-t0)/2400);
        el.querySelectorAll('[data-pv]').forEach((sp,i)=>{if(rows[i])sp.textContent=(rows[i].v*k).toFixed(1).replace('.',',')+'%';});
        const cp=$('#cpct');if(cp)cp.textContent=Math.round(k*100)+'%';

function countVotes(){
  const strs=E.strs,k=E.key,fin=shares(strs,12),rows=pollRows(fin,0,null),pos=rows.findIndex(r=>r.me);
  const pct=r=>r.v.toFixed(1).replace('.',',');
  if(k==='gov'||k==='pres'){
    if(rows[0].v>=50){
      E.win=rows[0].me;E.pct=rows[pos].v;
      return showCount('1º turno',rows.slice(0,4),E.win?`✅ ${G('Você foi eleito','Você foi eleita')} com ${pct(rows[0])}% dos votos válidos!`:`❌ ${rows[0].n} vence no 1º turno.`,E.win,()=>afterElection());
    }
    if(pos>1){
      E.win=false;E.pct=rows[pos].v;
      return showCount('1º turno',rows.slice(0,4),'❌ Você não foi ao 2º turno.',false,()=>afterElection());
    }
    const a=rows[0],b=rows[1];
    return showCount('1º turno',rows.slice(0,4),`Nenhum candidato passou de 50%: haverá 2º turno entre ${a.n} e ${b.n}.`,true,()=>{
      const raw=shares([strs[a.i],strs[b.i]],10),rs=raw.map(v=>50+(v-50)*0.55),r2=[Object.assign({},a,{v:rs[0]}),Object.assign({},b,{v:rs[1]})].sort((x,y)=>y.v-x.v);
      E.win=r2[0].me;E.pct=r2.find(r=>r.me).v;
      showCount('2º turno',r2,E.win?`✅ ${G('Você foi eleito','Você foi eleita')} com ${pct(r2[0])}% dos votos válidos!`:`❌ ${r2[0].n} vence o 2º turno.`,E.win,()=>afterElection());
    });
  }
  E.win=pos<E.seats;E.pct=rows[pos].v;
  const shown=rows.slice(0,Math.max(E.seats+3,5));
  if(!shown.some(r=>r.me))shown[shown.length-1]=rows[pos];
  showCount('Resultado',shown,E.win?`✅ ${G('Você foi eleito','Você foi eleita')} com ${pct(rows[pos])}% dos votos!`:'❌ Você não conquistou uma vaga.',E.win,()=>afterElection());
}
function afterElection(){
  const done=E.done,off=E.off,y=E.y,n=firstName();
  if(!E.win){logAdd(`Derrota nas urnas em ${y}.`);return endGame('elec');}
  const wasPres=st.power==='exe'&&st.rank===2;
  if(E.reel&&st.power===off.pw)st.rank=Math.max(st.rank,off.rk);else{st.power=off.pw;st.rank=off.rk;}
  st.terms=E.reel?st.terms+1:1;st.termEnd=y+off.term;
  if(!E.reel){st.yearsPower=0;st.sinceOffer=0;}
  if(E.reel)bump('reel');
  bump('elect');if(off.kind==='pres')bump('pres');
  const d=applyEffects([3,6,3,0,0,-4],1);
  const pct=E.pct.toFixed(1).replace('.',',');
  logAdd(`${G('Eleito','Eleita')} ${gn(off.n)} em ${y} com ${pct}% dos votos.`);
  refreshDash();
  const fin=()=>done();
  if(off.kind==='pres'&&!wasPres)showSash();
  showHeadline({h:E.reel?`${n} ${G('é reeleito','é reeleita')}: ${gn(off.n)} por mais ${off.term} anos`:`${n} ${G('é eleito','é eleita')} ${gn(off.n)}`,sub:`Com ${pct}% dos votos válidos, ${n} ${E.reel?'garante novo mandato':'conquista o cargo'} nas eleições de ${y}.`,tone:'pos'});
  if(!E.reel){showComic('posse',off.pw,off.rk);showCargoInfo(off.pw,off.rk,fin,true);}
  else fin();
}

  TO:()=>{let r='';for(let i=0;i<12;i++){const a=i*Math.PI/6;r+=`<line x1="${(16+10*Math.cos(a)).toFixed(1)}" y1="${(54+10*Math.sin(a)).toFixed(1)}" x2="${(16+15*Math.cos(a)).toFixed(1)}" y2="${(54+15*Math.sin(a)).toFixed(1)}" stroke="#e8a800" stroke-width="1.6"/>`;}return fr(0,0,100,70,FY)+`<polygon points="0,0 100,0 0,70" fill="${FB}"/><line x1="-6" y1="76" x2="106" y2="-6" stroke="#fff" stroke-width="17"/><circle cx="16" cy="54" r="8" fill="#e8a800"/>`+r;}
};
function flagSvg(uf){const f=FL[uf];return `<svg viewBox="0 0 100 70" preserveAspectRatio="xMidYMid slice" class="h-full w-full" aria-hidden="true">${f?f():fr(0,0,100,70,'#4b5563')}</svg>`;}
const flagBox=(uf,cls)=>`<span class="inline-block shrink-0 overflow-hidden rounded-[3px] ring-1 ring-white/25 ${cls||'h-6 w-9'}">${flagSvg(uf)}</span>`;
function pickUf(){
  openModal(`<div class="text-xs font-bold uppercase tracking-wider text-sky-300">Estado de origem</div>
    <div class="mt-3 grid gap-1.5">${UFS.map(u=>`<button data-uf="${u[0]}" class="flex items-center gap-3 rounded-xl px-2.5 py-2 text-left transition active:scale-[.98] ${draft.uf===u[0]?'bg-white/15 ring-1 ring-white/30':'bg-black/20 hover:bg-black/30'}">${flagBox(u[0])}<span class="flex-1 text-sm font-semibold">${u[1]}</span><span class="text-xs text-neutral-400">${u[0]}</span></button>`).join('')}</div>
    <button id="ufClose" class="mt-3 w-full rounded-xl py-2.5 text-sm font-semibold text-neutral-300 ring-1 ring-white/15 active:scale-95">Fechar</button>`);
  modalEl.querySelectorAll('[data-uf]').forEach(b=>b.addEventListener('click',()=>{draft.uf=b.dataset.uf;closeModal();renderCreate();}));
  $('#ufClose').addEventListener('click',closeModal);
}

/* ---------- Passagem de tempo ---------- */
function timeSplash(from,to,years,done){
  const pw=P[st.power];
  openModal(`<div class="py-4 text-center">
    <div class="text-xs font-bold uppercase tracking-wider text-neutral-400">⏳ O tempo passa · ${years} anos</div>
    <div class="mx-auto mt-3 h-24 w-24 overflow-hidden rounded-3xl border border-white/10 bg-black/20">${avatarSvg(st.look,st.age,st.power)}</div>
    <div id="yr" class="mt-3 text-6xl font-extrabold tabular-nums">${from}</div>
    <div class="mt-3 h-1.5 overflow-hidden rounded-full bg-black/40"><div id="yb" class="h-full rounded-full bg-emerald-400" style="width:0%;transition:width .2s linear"></div></div>
    <div class="mt-2 text-sm font-semibold ${pw.txt}">${cargo()} · ${st.age} anos</div>
    ${isGeneral(to)?'<div class="mt-1 text-xs font-bold text-amber-300">🗳️ Ano de eleições gerais</div>':isMunicipal(to)?'<div class="mt-1 text-xs font-bold text-amber-300">🗳️ Ano de eleições municipais</div>':''}
    <div class="mt-1 text-[11px] text-neutral-500">Toque para pular</div></div>`);
  const yr=$('#yr'),yb=$('#yb'),total=Math.max(1,to-from);
  let y=from,fin=false,iv=null;
  const end=()=>{if(fin)return;fin=true;clearInterval(iv);yr.textContent=to;yb.style.width='100%';setTimeout(()=>{closeModal();done();},350);};
  iv=setInterval(()=>{y++;yr.textContent=y;yb.style.width=((y-from)/total*100)+'%';if(y>=to)end();},Math.max(130,Math.round(1000/total)));
  $('#panel').addEventListener('click',end);
}

/* ---------- Transição de carreira ---------- */
function check(req){
  const lab={pr:'Prestígio',ap:'Apoio Popular',es:'Estabilidade'},miss=[],need=[];
  for(const k of ['pr','ap','es'])if(req[k]){need.push(`${lab[k]} ≥ ${req[k]}%`);if(st[k]<req[k])miss.push(k);}
  if(req.age){need.push(`idade ≥ ${req.age}`);if(st.age<req.age)miss.push('age');}
  return {ok:!miss.length,need:need.join(' · ')};
}
function buildTransitions(){
  const out=[],pw=P[st.power];
  if(st.rank<pw.ranks.length-1){
    const t=pw.ranks[st.rank+1];
    out.push({title:`Buscar promoção: ${gn(t.n)}`,desc:'Seguir na mesma carreira e subir na hierarquia do poder.',power:st.power,rank:st.rank+1,...check(t.req)});
  }
  const cross={
    jud:{rank:2,title:'Virar '+gn('Ministro de Tribunal Superior'),desc:'Indicação por notório saber jurídico e reputação ilibada.'},
    leg:{rank:1,title:'Candidatar-se ao Senado',desc:'Um partido convida você para disputar uma cadeira de senador.'},
    exe:{rank:0,title:st.power==='jud'?'Aceitar ser '+(curGender()==='f'?'Ministra':'Ministro')+' da Justiça':'Aceitar um Ministério',desc:'Convite do Presidente da República para integrar o governo.'}
  };
  for(const k of ['jud','leg','exe']){
    if(k===st.power)continue;
    const c=cross[k];
    out.push({title:c.title,desc:c.desc,power:k,rank:c.rank,...check(P[k].ranks[c.rank].req)});
  }
  out.push({title:'Continuar no cargo atual',desc:'Seguir sua trajetória sem mudanças por enquanto.',power:st.power,rank:st.rank,ok:true,need:'',stay:true});
  return out;
}
function showTransition(done,forced){
  const opts=buildTransitions().filter(o=>!(forced&&o.stay)),pw=P[st.power];
  if(forced)opts.push({title:'Encerrar a carreira pública',desc:'Deixar a política e se aposentar.',power:st.power,rank:st.rank,ok:true,need:'',quit:true});
  openModal(`
    <div class="text-xs font-bold uppercase tracking-wider ${pw.txt}">Janela de Oportunidade · ${st.year} · ${st.age} anos</div>
    <h2 class="mt-1 text-xl font-extrabold leading-tight">Uma nova porta se abre</h2>
    <p class="mt-2 text-sm leading-relaxed text-neutral-300">${forced?'Seu mandato terminou e você precisa decidir o próximo passo da sua vida pública.':`Depois de ${st.sinceOffer} anos de estrada, convites e possibilidades aparecem. Você pode mudar o rumo da sua vida pública.`}</p>
    <div class="mt-4 space-y-3">
      ${opts.map((o,i)=>{const tp=P[o.power];
        return `<button data-tr="${i}" ${o.ok?'':'aria-disabled="true"'} class="w-full rounded-2xl border p-3 text-left transition ${o.ok?'border-white/10 bg-[#3a3a41] hover:bg-[#44444c] active:scale-[.98]':'cursor-not-allowed border-white/5 bg-black/20 opacity-50'}">
          <div class="flex items-center gap-2"><span class="text-xl">${tp.em}</span><span class="flex-1 text-sm font-bold">${o.title}</span><span data-info="1" role="button" aria-label="Sobre o cargo" class="grid h-6 w-6 shrink-0 place-items-center rounded-full border border-white/30 bg-white/10 text-xs font-extrabold italic transition active:scale-90">i</span></div>
          <p class="mt-1 text-xs text-neutral-300">${o.desc}</p>
          ${o.need?`<p class="mt-1.5 text-[11px] font-semibold ${o.ok?'text-emerald-300':'text-rose-300'}">${o.ok?'✔ ':'✖ '}Requisitos: ${o.need}</p>`:''}
        </button>`;}).join('')}
    </div>`);
  modalEl.querySelectorAll('[data-tr]').forEach(b=>b.addEventListener('click',ev=>{
    if(ev.target.closest('[data-info]')){const oo=opts[+b.dataset.tr];return showCargoInfo(oo.power,oo.rank,()=>showTransition(done));}
    const o=opts[+b.dataset.tr];if(!o.ok)return;
    if(o.quit){closeModal();return endGame('ren');}
    const changedPower=o.power!==st.power;
    st.power=o.power;st.rank=o.rank;st.sinceOffer=0;if(!o.stay){st.sinceElection=0;st.terms=1;st.termEnd=nextGeneral(st.year)+((o.power==='leg'&&o.rank>=1)?4:0);}
    if(o.power==='jud'){if(st.filiado)logAdd('Como magistrado, você se desfiliou do partido.');st.filiado=false;}
    else if(!st.filiado){st.filiado=true;st.lean=0;st.fbYear=st.year;st.partyPath.push(st.party);logAdd('Você se filiou ao '+PARTIES[st.party].n+'.');}
    if(changedPower)st.yearsPower=0;
    if(o.stay)logAdd('Você decidiu continuar no cargo atual.');
    else logAdd(`Nova fase: ${o.title.replace('Aceitar ser ','').replace('Buscar promoção: ','')} (${P[o.power].n}).`);
    const fin=()=>{done?done():(busy=false,refreshDash());};
    if(o.stay){closeModal();fin();}else{showComic('posse',o.power,o.rank);showCargoInfo(o.power,o.rank,fin,true);}
  }));
}

/* ===================== FIM DE JORNADA ===================== */
const REASONS={
  ret:{em:'🎓',title:'Aposentadoria aos 75 anos',desc:'Chegou a hora de pendurar a toga, a faixa ou o terno e passar o bastão.'},
  pr:{em:'📉',title:'Perda total de prestígio',desc:{jud:'Denúncias de conduta antiética levaram ao seu afastamento pelo CNJ.',leg:'Um escândalo ético levou o Conselho de Ética a recomendar a cassação do seu mandato.',exe:'Escândalos corroeram sua credibilidade e você renunciou ao cargo.'}},
  es:{em:'💥',title:{jud:'Crise institucional',leg:'Cassação do mandato',exe:'Impeachment'},desc:{jud:'Os outros poderes se uniram contra você e sua permanência no cargo se tornou insustentável.',leg:'Isolado e em guerra com os demais poderes, você perdeu o mandato.',exe:'Sem base no Congresso e em atrito com os demais poderes, você sofreu impeachment.'}},
  ap:{em:'🗳️',title:{leg:'Derrota nas urnas',exe:'Rejeição popular total'},desc:{leg:'Sem apoio dos eleitores, você não conseguiu se reeleger.',exe:'Sem apoio nas ruas, seu governo desmoronou e você renunciou.'}},
  elec:{em:'🗳️',title:'Derrota nas urnas',desc:{leg:'Você disputou a reeleição, mas os eleitores escolheram outro caminho.',exe:'Você disputou a reeleição e saiu derrotado: acabou o seu tempo no governo.',jud:'Derrota nas urnas.'}},
  proc:{em:'⚖️',title:{jud:'Afastado pelo CNJ',leg:'Cassado pelo plenário',exe:'Impeachment aprovado'},desc:{jud:'O processo disciplinar terminou em afastamento e sua carreira na magistratura acabou.',leg:'O plenário votou pela perda do seu mandato.',exe:'O Senado condenou você por crime de responsabilidade e o afastou da Presidência da República ou do governo.'}},
  ren:{em:'🚪',title:{jud:'Aposentadoria antecipada',leg:'Renúncia ao mandato',exe:'Renúncia ao cargo'},desc:{jud:'Você pediu aposentadoria antes dos 75 anos e deixou o Judiciário.',leg:'Você abriu mão do mandato e deixou a vida parlamentar.',exe:'Você renunciou ao cargo e deixou o governo.'}}
};
function joinPt(a){return a.length<2?(a[0]||''):a.slice(0,-1).join(', ')+' e '+a[a.length-1];}
function legacyText(reason){
  const h=st.hist.slice(1),avg=k=>h.length?h.reduce((s,x)=>s+x[k],0)/h.length:st[k];
  const pr=avg('pr'),ap=avg('ap'),es=avg('es'),years=st.age-st.startAge;
  const verbs=[];
  if(st.yearsBy.jud)verbs.push('julgou');if(st.yearsBy.leg)verbs.push('legislou');if(st.yearsBy.exe)verbs.push('governou');
  const intro=(reason==='ret'||reason==='ren')
    ?`Você ${joinPt(verbs)||'serviu'} o Brasil por ${years} anos.`
    :`Sua carreira durou ${years} anos e terminou de forma abrupta, aos ${st.age}.`;
  const est=es>=65?'de extrema estabilidade institucional':es>=45?'de estabilidade razoável, com algumas turbulências':'de constantes crises com os outros poderes';
  const apt=ap>=65?'forte apoio popular':ap>=45?'aprovação mediana':'baixa popularidade';
  const prt=pr>=65?'reputação técnica e ética respeitada':pr>=45?'reputação mista':'reputação desgastada';
  const t2=`Seu legado foi ${est}, com ${apt} e ${prt}.`;
  const items=[['o prestígio',pr],['o apoio popular',ap],['a estabilidade política',es]].sort((a,b)=>b[1]-a[1]);
  const t3=items[0][1]-items[2][1]<8?'Seus indicadores ficaram bem equilibrados ao longo da carreira.'
    :`Seu ponto forte foi ${items[0][0]} (${Math.round(items[0][1])}% em média), mas ${items[2][0]} ficou como ponto fraco (${Math.round(items[2][1])}%) e cobrou seu preço.`;
  const dl=st.idh-st.startIdh;
  const idhT=dl>=0.04?'avançou bastante':dl>=0.01?'avançou de forma moderada':dl>=-0.01?'ficou praticamente estagnado':'retrocedeu';
  const sjT=st.sj>=65?'segurança jurídica sólida e contas em ordem':st.sj>=40?'segurança jurídica e contas em situação razoável':'insegurança jurídica e contas públicas fragilizadas';
  const t4=`Sob sua influência, o IDH do país ${idhT} (de ${fmtIdh(st.startIdh)} para ${fmtIdh(st.idh)}), e o Brasil terminou com ${sjT}.`;
  const ex=[];
  if(st.scandals>0||st.procs>0){
    const a=st.scandals>0?`${st.scandals} escândalo${st.scandals>1?'s':''} público${st.scandals>1?'s':''}`:'';
    const b=st.procs>0?`${st.procs} processo${st.procs>1?'s':''} de cassação ou afastamento superado${st.procs>1?'s':''}`:'';
    ex.push(`Sua carreira foi marcada por ${[a,b].filter(Boolean).join(' e ')}.`);
  } else if(st.risk<30)ex.push('Sua ficha ficou limpa: você manteve distância de escândalos e de esquemas.');
  if(st.partyPath.length)ex.push(`Trajetória partidária: ${st.partyPath.join(' → ')}.`);
  return [intro,t2,t3,t4,...ex];
}
function epithet(){
  const h=st.hist.slice(1),avg=k=>h.length?h.reduce((s,x)=>s+x[k],0)/h.length:st[k];
  const sc=(avg('pr')+avg('ap')+avg('es'))/3+(st.idh-st.startIdh)*200;
  const f=st.look.gender==='f';return sc>=68?'Estadista':sc>=55?(f?'Servidora pública respeitada':'Servidor público respeitado'):sc>=42?(f?'Política de altos e baixos':'Político de altos e baixos'):'Figura controversa';
}
function chartSvg(){
  let h=st.hist.slice();if(h.length<2)h=h.concat(h);
  const W=320,Hh=150,L=28,Rr=8,T=8,B=20;
  const a0=h[0].age,a1=Math.max(h[h.length-1].age,a0+1);
  const x=a=>L+(a-a0)/(a1-a0)*(W-L-Rr),y=v=>T+(100-v)/100*(Hh-T-B);
  const line=(k,c)=>`<polyline fill="none" stroke="${c}" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" points="${h.map(p=>x(p.age).toFixed(1)+','+y(p[k]).toFixed(1)).join(' ')}"/>`+h.map(p=>`<circle cx="${x(p.age).toFixed(1)}" cy="${y(p[k]).toFixed(1)}" r="2.5" fill="${c}"/>`).join('');
  const grid=[0,50,100].map(v=>`<line x1="${L}" x2="${W-Rr}" y1="${y(v)}" y2="${y(v)}" stroke="rgba(255,255,255,.12)" stroke-dasharray="3 3"/><text x="${L-4}" y="${y(v)+3}" text-anchor="end" font-size="9" fill="#9ca3af">${v}</text>`).join('');
  return `<svg viewBox="0 0 ${W} ${Hh}" class="w-full" role="img" aria-label="Evolução dos atributos ao longo da carreira">${grid}
    <text x="${L}" y="${Hh-5}" font-size="9" fill="#9ca3af">${a0} anos</text><text x="${W-Rr}" y="${Hh-5}" text-anchor="end" font-size="9" fill="#9ca3af">${a1} anos</text>
    ${line('pr','#fbbf24')}${line('ap','#38bdf8')}${line('es','#34d399')}</svg>
    <div class="mt-1 flex flex-wrap justify-center gap-x-4 gap-y-1 text-[11px] text-neutral-300">
      <span><b style="color:#fbbf24">●</b> Prestígio</span><span><b style="color:#38bdf8">●</b> Apoio Popular</span><span><b style="color:#34d399">●</b> Estabilidade</span></div>`;
}
function endGame(reason){
  st.over=true;busy=true;snap();closeModal();refreshDash();
  const R=REASONS[reason];
  const title=typeof R.title==='string'?R.title:R.title[st.power];
  const desc=typeof R.desc==='string'?R.desc:R.desc[st.power];
  const paras=legacyText(reason);
  const final=[['Prestígio Institucional',st.pr],['Apoio Popular',st.ap],['Estabilidade Política',st.es],['Segurança Jurídica / Orçamento',st.sj]];
  const path=st.path.map(p=>`<li class="flex items-center justify-between gap-2 rounded-xl bg-black/25 px-3 py-2 text-sm"><span>${P[p.power].em} ${p.cargo}</span><span class="font-bold tabular-nums text-neutral-300">${p.years} anos</span></li>`).join('');
  modalEl.innerHTML=`<div class="fixed inset-0 z-[60] overflow-y-auto bg-[#121212]"><div class="fade-in mx-auto max-w-md space-y-4 p-4" style="padding-top:calc(1rem + env(safe-area-inset-top,0px));padding-bottom:calc(2rem + env(safe-area-inset-bottom,0px))">
    <div class="relative overflow-hidden ${CARD} text-center"><div class="absolute inset-0">${bannerSvg(reason==='ret'?'ret':bannerKindFor(st.power,st.rank))}</div><div class="absolute inset-0" style="background:linear-gradient(180deg,rgba(18,18,18,.35) 0%,rgba(18,18,18,.78) 70%,rgba(18,18,18,.88) 100%)"></div><div class="relative">
      <div class="mx-auto h-28 w-28 overflow-hidden rounded-3xl border border-white/10 bg-black/20">${avatarSvg(st.look,st.age,st.power)}</div><div class="mt-2 text-3xl">${R.em}</div>
      <div class="mt-2 text-xs font-bold uppercase tracking-wider text-neutral-400">${reason==='ret'?'Fim da jornada':'Fim de carreira'}</div>
      <h1 class="mt-1 text-2xl font-extrabold">${title}</h1>
      <p class="mt-1 text-sm text-neutral-300">${desc}</p>
      <div class="mt-3 inline-block rounded-full bg-white/10 px-3 py-1 text-sm font-bold">${esc(st.name)} · ${epithet()}</div>
      <div class="mt-2 text-xs font-semibold text-neutral-400">Carreira de ${st.startYear} a ${st.year}</div></div>
    </div>
    <div class="${CARD}">
      <h2 class="text-xs font-bold uppercase tracking-wider text-neutral-400">Painel de legado</h2>
      <div class="mt-2 space-y-2 text-sm leading-relaxed text-neutral-100">${paras.map(p=>`<p>${p}</p>`).join('')}</div>
    </div>
    <div class="${CARD}">
      <h2 class="mb-2 text-xs font-bold uppercase tracking-wider text-neutral-400">Seus status ao longo da carreira</h2>
      ${chartSvg()}
    </div>
    <div class="${CARD} space-y-3">
      <h2 class="text-xs font-bold uppercase tracking-wider text-neutral-400">Status finais</h2>
      ${final.map(f=>`<div><div class="flex justify-between text-sm"><span>${f[0]}</span><span class="tabular-nums text-neutral-300">${Math.round(f[1])}%</span></div><div class="mt-1 h-2.5 overflow-hidden rounded-full bg-black/40"><div class="h-full rounded-full" style="width:${clamp(f[1])}%;background:${colorOf(f[1])}"></div></div></div>`).join('')}
      <div class="flex items-center justify-between text-sm"><span>IDH do Brasil</span><span class="font-bold tabular-nums">${fmtIdh(st.startIdh)} → ${fmtIdh(st.idh)}</span></div>
    </div>
    <div class="${CARD}">
      <h2 class="mb-2 text-xs font-bold uppercase tracking-wider text-neutral-400">Trajetória</h2>
      <ul class="space-y-2">${path}</ul>
    </div>
    ${badgesHtml(reason)}
    <button id="again" class="w-full rounded-2xl bg-emerald-500 py-4 text-lg font-extrabold text-black shadow-lg transition active:scale-95">Jogar de novo 🔄</button>
  </div></div>`;
  if(reason==='ret')showComic('retire',st.power,st.rank);
  $('#again').addEventListener('click',()=>{closeModal();draft={...draft,track:''};renderCreate();window.scrollTo(0,0);});
}

renderCreate();
})();
</script>
